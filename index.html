<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tellawarfare - Teletubby Battle Arena</title>
  <style>
    :root {
      --sky-top: #7ec8ff;
      --sky-bottom: #d9f3ff;
      --grass: #5dbb63;
      --hill: #3fa35d;
      --panel: rgba(20, 20, 30, 0.75);
      --panel-border: rgba(255,255,255,0.18);
      --text: #f5f7ff;
      --accent: #ffca5f;
      --danger: #ff5d5d;
      --good: #77ffad;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: linear-gradient(var(--sky-top), var(--sky-bottom));
      overflow: hidden;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game {
      position: relative;
      width: min(96vw, 1200px);
      height: min(92vh, 760px);
      border: 4px solid rgba(255,255,255,0.25);
      border-radius: 20px;
      overflow: hidden;
      background: linear-gradient(#92d6ff, #d7f2ff 55%, #d4ffb5 56%, var(--grass) 100%);
      box-shadow: 0 30px 60px rgba(0,0,0,0.28);
    }

    .hud {
      position: absolute;
      inset: 0 0 auto 0;
      display: flex;
      justify-content: space-between;
      padding: 18px 22px;
      z-index: 20;
      pointer-events: none;
    }

    .panel {
      background: var(--panel);
      border: 2px solid var(--panel-border);
      border-radius: 14px;
      box-shadow: inset 0 0 18px rgba(255,255,255,0.05);
      padding: 10px 14px;
      backdrop-filter: blur(2px);
    }

    #scoreboard {
      min-width: 200px;
    }

    .title {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0.8;
      margin-bottom: 6px;
    }

    .big {
      font-size: 28px;
      font-weight: 700;
    }

    #message {
      position: absolute;
      left: 50%;
      top: 86px;
      transform: translateX(-50%);
      min-width: 320px;
      text-align: center;
      font-weight: 700;
      font-size: 16px;
      background: rgba(18, 23, 31, 0.8);
      border: 2px solid rgba(255,255,255,0.14);
      border-radius: 999px;
      padding: 12px 22px;
      z-index: 30;
      box-shadow: 0 10px 24px rgba(0,0,0,0.2);
    }

    .sky {
      position: absolute;
      inset: 0 0 180px 0;
    }

    .cloud {
      position: absolute;
      background: rgba(255,255,255,0.75);
      border-radius: 999px;
      filter: blur(1px);
      animation: floatCloud 18s linear infinite alternate;
    }
    .cloud::before, .cloud::after{
      content: "";
      position: absolute;
      background: inherit;
      border-radius: inherit;
    }
    .cloud:nth-child(1){ left: 12%; top: 70px; width: 120px; height: 44px; }
    .cloud:nth-child(1)::before { width: 48px; height: 48px; left: 16px; top: -20px; }
    .cloud:nth-child(1)::after { width: 58px; height: 52px; right: 18px; top: -22px; }

    .cloud:nth-child(2){ left: 62%; top: 115px; width: 140px; height: 46px; animation-delay: 1s; }
    .cloud:nth-child(2)::before { width: 52px; height: 52px; left: 18px; top: -24px; }
    .cloud:nth-child(2)::after { width: 66px; height: 54px; right: 20px; top: -28px; }

    .cloud:nth-child(3){ left: 78%; top: 52px; width: 110px; height: 40px; animation-delay: 2s; }
    .cloud:nth-child(3)::before { width: 42px; height: 42px; left: 12px; top: -18px; }
    .cloud:nth-child(3)::after { width: 56px; height: 48px; right: 17px; top: -23px; }

    @keyframes floatCloud {
      0% { transform: translateX(-8px); }
      100% { transform: translateX(12px); }
    }

    .sun {
      position: absolute;
      right: 110px;
      top: 42px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff7b0 0%, #ffd65a 42%, #ffc93a 100%);
      box-shadow: 0 0 30px rgba(255,202,95,0.8);
      z-index: 2;
    }

    .hill {
      position: absolute;
      bottom: 160px;
      width: 56%;
      height: 120px;
      background: var(--hill);
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
      opacity: 0.95;
    }
    .hill.left { left: -8%; }
    .hill.right { right: -10%; width: 60%; }

    .ground {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      height: 190px;
      background: linear-gradient(#6bdc6d, #3faf52 60%, #2d8d41 100%);
      border-top: 4px solid rgba(255,255,255,0.2);
      z-index: 3;
    }

    .ground::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          90deg,
          rgba(255,255,255,0.08) 0 2px,
          transparent 2px 36px
        );
      opacity: 0.35;
    }

    .fighter {
      position: absolute;
      bottom: 170px;
      width: 120px;
      height: 140px;
      z-index: 10;
      filter: drop-shadow(0 8px 10px rgba(0,0,0,0.18));
    }

    .fighter .body {
      position: absolute;
      left: 50%;
      bottom: 0;
      transform: translateX(-50%);
      width: 62px;
      height: 88px;
      border-radius: 18px 18px 10px 10px;
      background: var(--body-color);
    }

    .fighter .head {
      position: absolute;
      left: 50%;
      top: 0;
      transform: translateX(-50%);
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--skin-color);
      border: 5px solid var(--outline, rgba(0,0,0,0.15));
      box-shadow: inset 0 -10px 0 rgba(0,0,0,0.05);
    }

    .fighter .face {
      position: absolute;
      inset: 10px 12px 12px 12px;
      border-radius: 50%;
      background: var(--face-color);
    }

    .fighter .eyes {
      position: absolute;
      inset: 12px 0 auto 0;
      height: 18px;
      display: flex;
      justify-content: center;
      gap: 12px;
    }

    .fighter .eyes span {
      width: 8px;
      height: 12px;
      border-radius: 50%;
      background: #1e1e22;
      display: block;
    }

    .fighter .antenna {
      position: absolute;
      width: 8px;
      height: 32px;
      background: var(--antenna-color);
      border-radius: 50%;
      top: -32px;
      left: 50%;
      transform: translateX(-50%);
      box-shadow: inset 0 0 0 2px rgba(0,0,0,0.1);
    }

    .fighter .smile {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      width: 22px;
      height: 12px;
      border-bottom: 4px solid #333;
      border-radius: 0 0 18px 18px;
    }

    .fighter .arm {
      position: absolute;
      width: 16px;
      height: 76px;
      border-radius: 10px;
      background: var(--arm-color, var(--body-color));
      top: 54px;
    }

    .fighter .arm.left {
      left: 4px;
      transform: rotate(24deg);
      transform-origin: top center;
    }

    .fighter .arm.right {
      right: 4px;
      transform: rotate(-24deg);
      transform-origin: top center;
    }

    .fighter .leg {
      position: absolute;
      width: 16px;
      height: 56px;
      bottom: -8px;
      border-radius: 10px;
      background: var(--leg-color, var(--body-color));
    }

    .fighter .leg.left { left: 42px; }
    .fighter .leg.right { right: 42px; }

    .weapon {
      position: absolute;
      width: 10px;
      height: 120px;
      top: 40px;
      right: -8px;
      transform-origin: center bottom;
      box-shadow: inset 0 0 0 2px rgba(0,0,0,0.12);
    }

    .weapon.sword {
      background: linear-gradient(#d9dfe7, #7d8699);
      border-radius: 8px;
      width: 10px;
      height: 120px;
    }

    .weapon.sword::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -18px;
      transform: translateX(-50%);
      width: 22px;
      height: 22px;
      background: linear-gradient(#f7f5d8, #d4c87a);
      border: 3px solid rgba(92,76,34,0.55);
      border-radius: 50%;
      box-shadow: 0 0 0 3px rgba(255,255,255,0.2);
    }

    .weapon.sword::after {
      content: "";
      position: absolute;
      left: 50%;
      top: -32px;
      transform: translateX(-50%);
      width: 6px;
      height: 18px;
      background: #b38b43;
      border-radius: 2px;
    }

    .weapon.axe {
      width: 18px;
      background: linear-gradient(#8b6f47, #5c4a2e);
      border-radius: 6px;
      height: 80px;
    }

    .weapon.axe::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -32px;
      transform: translateX(-50%);
      width: 48px;
      height: 32px;
      background: linear-gradient(135deg, #c0a080 0%, #8b7355 50%, #5c4a2e 100%);
      border-radius: 8px 8px 2px 2px;
      border: 2px solid rgba(0,0,0,0.2);
    }

    .weapon.mace {
      width: 12px;
      background: linear-gradient(#a08060, #6b5d4a);
      border-radius: 4px;
      height: 85px;
    }

    .weapon.mace::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -42px;
      transform: translateX(-50%);
      width: 36px;
      height: 36px;
      background: radial-gradient(circle, #d4af88 0%, #a08860 50%, #6b5d4a 100%);
      border-radius: 50%;
      border: 2px solid rgba(0,0,0,0.3);
    }

    .weapon.lance {
      width: 8px;
      background: linear-gradient(#b0a090, #6b6050);
      border-radius: 4px;
      height: 140px;
    }

    .weapon.lance::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -28px;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      border-left: 12px solid transparent;
      border-right: 12px solid transparent;
      border-bottom: 28px solid #b0a090;
    }

    .weapon.bow {
      width: 28px;
      height: 110px;
      background: linear-gradient(90deg, #6b4423 0%, #8b5a2b 50%, #6b4423 100%);
      border-radius: 50%;
      position: relative;
    }

    .weapon.bow::before {
      content: "";
      position: absolute;
      left: 50%;
      top: 8px;
      transform: translateX(-50%);
      width: 2px;
      height: 90px;
      background: #e8d4b8;
      box-shadow: 
        8px 0 0 rgba(0,0,0,0.1),
        -8px 0 0 rgba(0,0,0,0.1);
    }

    .weapon.flail {
      width: 10px;
      background: linear-gradient(#b0a090, #6b6050);
      border-radius: 4px;
      height: 60px;
    }

    .weapon.flail::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -45px;
      transform: translateX(-50%);
      width: 28px;
      height: 28px;
      background: radial-gradient(circle, #9a8070 0%, #6b5d4a 100%);
      border-radius: 50%;
      border: 2px solid rgba(0,0,0,0.2);
    }

    .weapon.flail::after {
      content: "";
      position: absolute;
      left: 50%;
      top: -55px;
      transform: translateX(-50%);
      width: 3px;
      height: 12px;
      background: linear-gradient(#8b7355, #5c4a2e);
      border-radius: 2px;
    }

    .fighter.enemy .weapon {
      left: -10px;
      right: auto;
      transform: scaleX(-1);
    }

    .fighter.enemy .head {
      border-color: rgba(0,0,0,0.18);
    }

    .fighter.enemy .arm.right { transform: rotate(24deg); }
    .fighter.enemy .arm.left { transform: rotate(-24deg); }

    .fighter.enemy {
      transform: scaleX(-1);
    }

    .fighter.enemy .face {
      background: var(--face-color);
    }

    .fighter.player { left: 18%; }
    .fighter.enemy { right: 18%; }

    .weapon-swing {
      animation: swing 0.4s ease-in-out;
    }

    @keyframes swing {
      0% { transform: rotate(0deg); }
      20% { transform: rotate(-26deg); }
      50% { transform: rotate(18deg); }
      100% { transform: rotate(0deg); }
    }

    .attack-flash {
      animation: flash 0.25s ease-out;
    }

    @keyframes flash {
      0% { box-shadow: 0 0 0 rgba(255,255,255,0); }
      50% { box-shadow: 0 0 30px rgba(255,255,255,0.8); }
      100% { box-shadow: 0 0 0 rgba(255,255,255,0); }
    }

    .health {
      position: absolute;
      bottom: 115px;
      width: 200px;
      height: 18px;
      border-radius: 999px;
      background: rgba(0,0,0,0.18);
      border: 2px solid rgba(255,255,255,0.2);
      overflow: hidden;
      z-index: 25;
    }

    .health.player {
      left: 28px;
    }

    .health.enemy {
      right: 28px;
    }

    .health-bar {
      position: absolute;
      inset: 0 auto 0 0;
      width: 100%;
      background: linear-gradient(90deg, #5cff88, #7cf379, #ffc857, #ff5d5d);
      border-radius: inherit;
      transition: width 0.25s ease;
    }

    .health-number {
      position: absolute;
      inset: -30px 0 auto 0;
      text-align: center;
      font-weight: 700;
      font-size: 18px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.35);
    }

    .controls {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 24px;
      z-index: 25;
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      appearance: none;
      border: none;
      border-radius: 12px;
      background: linear-gradient(#ffefb1, #ffc146);
      color: #2b1c00;
      font-size: 16px;
      font-weight: 800;
      padding: 12px 18px;
      cursor: pointer;
      box-shadow: 0 7px 0 #d78d16, 0 12px 18px rgba(0,0,0,0.25);
      transition: transform 0.08s ease, box-shadow 0.08s ease;
    }

    button:active, button.active {
      transform: translateY(4px);
      box-shadow: 0 3px 0 #d78d16, 0 8px 12px rgba(0,0,0,0.2);
    }

    button .key {
      display: block;
      font-size: 11px;
      opacity: 0.7;
      margin-top: 2px;
    }

    #restartBtn {
      background: linear-gradient(#f4f4f4, #dfe6eb);
      box-shadow: 0 7px 0 #a8b2bc, 0 12px 18px rgba(0,0,0,0.22);
    }

    #restartBtn:active {
      box-shadow: 0 3px 0 #a8b2bc, 0 8px 12px rgba(0,0,0,0.2);
    }

    .floating-dmg {
      position: absolute;
      font-weight: 900;
      font-size: 30px;
      color: #ff4040;
      text-shadow: 0 3px 8px rgba(0,0,0,0.35);
      z-index: 40;
      animation: floatDamage 0.7s ease-out forwards;
    }

    @keyframes floatDamage {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-38px) scale(1.25); }
    }

    .weapon-indicator {
      position: absolute;
      font-size: 11px;
      font-weight: 700;
      background: rgba(0,0,0,0.3);
      padding: 4px 8px;
      border-radius: 6px;
      z-index: 25;
    }

    .weapon-indicator.player {
      left: 28px;
      bottom: 155px;
    }

    .weapon-indicator.enemy {
      right: 28px;
      bottom: 155px;
    }

    .status-effect {
      position: absolute;
      font-size: 12px;
      font-weight: 700;
      color: #ffff00;
      text-shadow: 0 2px 4px rgba(0,0,0,0.5);
      z-index: 26;
    }

    .status-effect.player {
      left: 28px;
      top: 270px;
    }

    .status-effect.enemy {
      right: 28px;
      top: 270px;
    }

    @media (max-width: 800px) {
      #game { width: 100vw; height: 100vh; border-radius: 0; }
      .fighter.player { left: 8%; }
      .fighter.enemy { right: 8%; }
      .health { width: 150px; }
      button { font-size: 14px; padding: 10px 14px; }
      button .key { display: none; }
    }
  </style>
</head>
<body>
  <div id="game">
    <div class="sky">
      <div class="sun"></div>
      <div class="cloud"></div>
      <div class="cloud"></div>
      <div class="cloud"></div>
    </div>

    <div class="hill left"></div>
    <div class="hill right"></div>

    <div class="hud">
      <div class="panel" id="scoreboard">
        <div class="title">Tellawarfare</div>
        <div class="big"><span id="playerScore">0</span> : <span id="enemyScore">0</span></div>
      </div>

      <div class="panel">
        <div class="title">Battle</div>
        <div class="big" id="roundText">Round 1</div>
      </div>
    </div>

    <div id="message">Choose your weapon and fight!</div>

    <div class="weapon-indicator player">
      <span id="playerWeaponName">SWORD</span>
    </div>

    <div class="weapon-indicator enemy">
      <span id="enemyWeaponName">SWORD</span>
    </div>

    <div class="status-effect player" id="playerStatus"></div>
    <div class="status-effect enemy" id="enemyStatus"></div>

    <div class="fighter player" id="player">
      <div class="antenna"></div>
      <div class="head">
        <div class="face">
          <div class="eyes">
            <span></span><span></span>
          </div>
          <div class="smile"></div>
        </div>
      </div>
      <div class="arm left"></div>
      <div class="arm right"></div>
      <div class="body"></div>
      <div class="leg left"></div>
      <div class="leg right"></div>
      <div class="weapon sword"></div>
    </div>

    <div class="health player">
      <div class="health-bar" id="playerHealthBar"></div>
    </div>

    <div class="fighter enemy" id="enemy">
      <div class="antenna"></div>
      <div class="head">
        <div class="face">
          <div class="eyes">
            <span></span><span></span>
          </div>
          <div class="smile"></div>
        </div>
      </div>
      <div class="arm left"></div>
      <div class="arm right"></div>
      <div class="body"></div>
      <div class="leg left"></div>
      <div class="leg right"></div>
      <div class="weapon sword"></div>
    </div>

    <div class="health enemy">
      <div class="health-bar" id="enemyHealthBar"></div>
    </div>

    <div class="controls">
      <button id="swordBtn">🗡️ Sword<span class="key">(Q)</span></button>
      <button id="axeBtn">🪓 Axe<span class="key">(W)</span></button>
      <button id="maceBtn">⚒️ Mace<span class="key">(E)</span></button>
      <button id="lanceBtn">🏹 Lance<span class="key">(R)</span></button>
      <button id="bowBtn">🏹 Bow<span class="key">(T)</span></button>
      <button id="flailBtn">⛓️ Flail<span class="key">(Y)</span></button>
      <button id="blockBtn">🛡️ Block<span class="key">(SPACE)</span></button>
      <button id="restartBtn">Restart<span class="key">(ESC)</span></button>
    </div>

    <div class="ground"></div>
  </div>

  <script>
    const player = document.getElementById('player');
    const enemy = document.getElementById('enemy');
    const message = document.getElementById('message');
    const playerHealthBar = document.getElementById('playerHealthBar');
    const enemyHealthBar = document.getElementById('enemyHealthBar');
    const playerScoreEl = document.getElementById('playerScore');
    const enemyScoreEl = document.getElementById('enemyScore');
    const roundText = document.getElementById('roundText');
    const playerWeaponName = document.getElementById('playerWeaponName');
    const enemyWeaponName = document.getElementById('enemyWeaponName');
    const playerStatusEl = document.getElementById('playerStatus');
    const enemyStatusEl = document.getElementById('enemyStatus');

    const weapons = {
      sword: { name: 'SWORD', minDmg: 12, maxDmg: 18, speed: 1, type: 'balanced' },
      axe: { name: 'AXE', minDmg: 16, maxDmg: 24, speed: 0.8, type: 'heavy' },
      mace: { name: 'MACE', minDmg: 14, maxDmg: 22, speed: 0.9, type: 'heavy' },
      lance: { name: 'LANCE', minDmg: 18, maxDmg: 26, speed: 0.7, type: 'pierce' },
      bow: { name: 'BOW', minDmg: 10, maxDmg: 16, speed: 1.2, type: 'ranged' },
      flail: { name: 'FLAIL', minDmg: 13, maxDmg: 20, speed: 0.9, type: 'chaos' }
    };

    let playerHealth = 100;
    let enemyHealth = 100;
    let playerScore = 0;
    let enemyScore = 0;
    let round = 1;
    let playerBlocking = false;
    let enemyBlocking = false;
    let gameOver = false;
    let playerWeapon = 'sword';
    let enemyWeapon = 'sword';
    let playerDotDamage = 0;
    let enemyDotDamage = 0;
    let playerCanAct = true;
    let enemyCanAct = true;

    const buttons = {
      sword: document.getElementById('swordBtn'),
      axe: document.getElementById('axeBtn'),
      mace: document.getElementById('maceBtn'),
      lance: document.getElementById('lanceBtn'),
      bow: document.getElementById('bowBtn'),
      flail: document.getElementById('flailBtn'),
      block: document.getElementById('blockBtn'),
      restart: document.getElementById('restartBtn')
    };

    // Character colors
    const characters = [
      { name: 'Tinky Winky', body: '#a82b8f', skin: '#ffc4d9', face: '#ff8ab8', antenna: '#a82b8f' },
      { name: 'Dipsy', body: '#3ba800', skin: '#ffcba8', face: '#ffb88a', antenna: '#3ba800' },
      { name: 'Laa-Laa', body: '#ff6600', skin: '#ffd4a8', face: '#ffc890', antenna: '#ff6600' },
      { name: 'Po', body: '#e60000', skin: '#ffcdb8', face: '#ffb0a0', antenna: '#e60000' }
    ];

    let playerChar = characters[0];
    let enemyChar = characters[1];

    function setupCharacterColors() {
      const root = document.documentElement;
      player.style.setProperty('--body-color', playerChar.body);
      player.style.setProperty('--skin-color', playerChar.skin);
      player.style.setProperty('--face-color', playerChar.face);
      player.style.setProperty('--antenna-color', playerChar.antenna);

      enemy.style.setProperty('--body-color', enemyChar.body);
      enemy.style.setProperty('--skin-color', enemyChar.skin);
      enemy.style.setProperty('--face-color', enemyChar.face);
      enemy.style.setProperty('--antenna-color', enemyChar.antenna);
    }

    function changeWeapon(weaponType) {
      playerWeapon = weaponType;
      playerWeaponName.textContent = weapons[weaponType].name;
      
      const weaponEl = player.querySelector('.weapon');
      weaponEl.className = 'weapon ' + weaponType;
      
      updateButtonStates();
    }

    function updateButtonStates() {
      Object.keys(weapons).forEach(w => {
        buttons[w].classList.toggle('active', playerWeapon === w);
      });
    }

    function setMessage(text) {
      message.textContent = text;
    }

    function setHealthBar(element, value) {
      element.style.width = value + '%';
    }

    function updateStatus() {
      if (playerDotDamage > 0) {
        playerStatusEl.textContent = '🔥 BLEED';
      } else if (playerBlocking) {
        playerStatusEl.textContent = '🛡️ BLOCKING';
      } else {
        playerStatusEl.textContent = '';
      }

      if (enemyDotDamage > 0) {
        enemyStatusEl.textContent = '🔥 BLEED';
      } else if (enemyBlocking) {
        enemyStatusEl.textContent = '🛡️ BLOCKING';
      } else {
        enemyStatusEl.textContent = '';
      }
    }

    function flashTarget(target) {
      target.classList.remove('attack-flash');
      void target.offsetWidth;
      target.classList.add('attack-flash');
    }

    function showDamage(target, amount, xOffset = 0, yOffset = -20, color = '#ff4040') {
      const dmg = document.createElement('div');
      dmg.className = 'floating-dmg';
      dmg.textContent = '-' + amount;
      dmg.style.color = color;
      dmg.style.left = target.offsetLeft + 40 + xOffset + 'px';
      dmg.style.top = target.offsetTop + 20 + yOffset + 'px';
      document.getElementById('game').appendChild(dmg);

      setTimeout(() => dmg.remove(), 700);
    }

    function swingWeapon(target) {
      const weapon = target.querySelector('.weapon');
      weapon.classList.remove('weapon-swing');
      void weapon.offsetWidth;
      weapon.classList.add('weapon-swing');
    }

    function randomBetween(min, max) {
      return Math.random() * (max - min) + min;
    }

    function calculateDamage(weaponType, modifier = 1) {
      const w = weapons[weaponType];
      const baseDmg = w.minDmg + randomBetween(0, w.maxDmg - w.minDmg);
      let dmg = Math.round(baseDmg * modifier);
      
      // Weapon effects
      if (weaponType === 'flail' && Math.random() < 0.25) {
        dmg = Math.round(dmg * 1.35); // Flail has chaos damage boost
      }
      
      return dmg;
    }

    function playerAttack() {
      if (gameOver || !playerCanAct) return;
      playerCanAct = false;
      playerBlocking = false;

      const damage = calculateDamage(playerWeapon);
      const blockChance = Math.random();
      
      let actualDamage = damage;
      
      if (enemyBlocking && blockChance < 0.65) {
        actualDamage = Math.max(3, Math.round(damage * 0.35));
        setMessage('Enemy blocks! Only ' + actualDamage + ' damage!');
      } else {
        setMessage('You strike with your ' + weapons[playerWeapon].name + '!');
      }

      enemyHealth = Math.max(0, enemyHealth - actualDamage);
      
      // Flail has bleed chance
      if (playerWeapon === 'flail' && Math.random() < 0.35 && !enemyBlocking) {
        enemyDotDamage = Math.max(enemyDotDamage, 2);
        setMessage(setMessage().split('!')[0] + '! BLEED APPLIED!');
      }

      setHealthBar(enemyHealthBar, enemyHealth);
      swingWeapon(player);
      flashTarget(enemy);
      showDamage(enemy, actualDamage, 15, -8);

      if (enemyHealth <= 0) {
        endRound('player');
        return;
      }

      updateStatus();
      setTimeout(enemyTurn, 600);
    }

    function playerBlock() {
      if (gameOver || !playerCanAct) return;
      playerCanAct = false;
      playerBlocking = true;
      setMessage('You raise your guard!');
      updateStatus();
      
      setTimeout(() => {
        if (!gameOver) {
          playerCanAct = true;
          playerBlocking = false;
          updateStatus();
          setMessage('Choose your next action!');
        }
      }, 800);
    }

    function enemyTurn() {
      if (gameOver || !enemyCanAct) return;
      enemyCanAct = false;

      // Apply bleed damage
      if (enemyDotDamage > 0) {
        const bleedDmg = Math.round(enemyDotDamage * 3);
        enemyHealth = Math.max(0, enemyHealth - bleedDmg);
        setHealthBar(enemyHealthBar, enemyHealth);
        showDamage(enemy, bleedDmg, 15, -8, '#ff6b6b');
        enemyDotDamage = Math.max(0, enemyDotDamage - 1);
      }

      const actionRoll = Math.random();

      if (actionRoll < 0.3) {
        enemyBlocking = true;
        setMessage('Enemy blocks!');
        updateStatus();
        setTimeout(() => {
          enemyBlocking = false;
          updateStatus();
          if (!gameOver) {
            playerCanAct = true;
            setMessage('Your turn!');
          }
        }, 700);
        return;
      }

      // Enemy picks random weapon
      const weaponChoices = Object.keys(weapons);
      enemyWeapon = weaponChoices[Math.floor(Math.random() * weaponChoices.length)];
      enemyWeaponName.textContent = weapons[enemyWeapon].name;
      
      const weaponEl = enemy.querySelector('.weapon');
      weaponEl.className = 'weapon ' + enemyWeapon;

      const damage = calculateDamage(enemyWeapon);
      let actualDamage = damage;

      if (playerBlocking) {
        actualDamage = Math.max(2, Math.round(damage * 0.4));
        setMessage('You block enemy ' + weapons[enemyWeapon].name + '! ' + actualDamage + ' damage!');
      } else {
        setMessage('Enemy attacks with ' + weapons[enemyWeapon].name + '!');
      }

      playerHealth = Math.max(0, playerHealth - actualDamage);
      
      // Flail bleed
      if (enemyWeapon === 'flail' && Math.random() < 0.35 && !playerBlocking) {
        playerDotDamage = Math.max(playerDotDamage, 2);
      }

      setHealthBar(playerHealthBar, playerHealth);
      swingWeapon(enemy);
      flashTarget(player);
      showDamage(player, actualDamage, -25, -10);

      updateStatus();

      if (playerHealth <= 0) {
        endRound('enemy');
        return;
      }

      setTimeout(() => {
        playerCanAct = true;
        playerBlocking = false;
        updateStatus();
        setMessage('Your turn! Choose weapon and attack!');
      }, 700);
    }

    function endRound(winner) {
      gameOver = true;
      playerCanAct = false;
      enemyCanAct = false;

      if (winner === 'player') {
        setMessage(playerChar.name + ' is victorious!');
        playerScore += 1;
      } else {
        setMessage(enemyChar.name + ' wins this round!');
        enemyScore += 1;
      }

      playerScoreEl.textContent = playerScore;
      enemyScoreEl.textContent = enemyScore;

      round += 1;
      roundText.textContent = 'Round ' + round;

      setTimeout(() => {
        resetBattle();
      }, 2000);
    }

    function resetBattle() {
      playerHealth = 100;
      enemyHealth = 100;
      playerBlocking = false;
      enemyBlocking = false;
      playerDotDamage = 0;
      enemyDotDamage = 0;
      gameOver = false;
      playerCanAct = true;
      enemyCanAct = true;
      playerWeapon = 'sword';
      enemyWeapon = 'sword';

      // Switch characters
      playerChar = characters[round % characters.length];
      enemyChar = characters[(round + 1) % characters.length];
      setupCharacterColors();

      playerWeaponName.textContent = 'SWORD';
      enemyWeaponName.textContent = 'SWORD';

      let playerWeaponEl = player.querySelector('.weapon');
      playerWeaponEl.className = 'weapon sword';

      let enemyWeaponEl = enemy.querySelector('.weapon');
      enemyWeaponEl.className = 'weapon sword';

      setHealthBar(playerHealthBar, 100);
      setHealthBar(enemyHealthBar, 100);
      updateStatus();
      updateButtonStates();
      setMessage('Next Round! Choose your weapon!');
    }

    // Button click handlers
    Object.keys(weapons).forEach(w => {
      buttons[w].addEventListener('click', () => changeWeapon(w));
    });

    buttons.block.addEventListener('click', playerBlock);
    buttons.restart.addEventListener('click', () => {
      playerScore = 0;
      enemyScore = 0;
      round = 1;
      playerScoreEl.textContent = '0';
      enemyScoreEl.textContent = '0';
      roundText.textContent = 'Round 1';
      playerChar = characters[0];
      enemyChar = characters[1];
      setupCharacterColors();
      resetBattle();
    });

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      const key = e.key.toUpperCase();
      
      if (key === 'Q') changeWeapon('sword');
      if (key === 'W') changeWeapon('axe');
      if (key === 'E') changeWeapon('mace');
      if (key === 'R') changeWeapon('lance');
      if (key === 'T') changeWeapon('bow');
      if (key === 'Y') changeWeapon('flail');
      
      if (key === ' ') {
        e.preventDefault();
        playerBlock();
      }
      
      if (key === 'ENTER') {
        playerAttack();
      }
      
      if (key === 'ESCAPE') {
        buttons.restart.click();
      }
    });

    // Attack on button click (any weapon button while holding it acts as attack)
    Object.keys(weapons).forEach(w => {
      buttons[w].addEventListener('click', () => {
        setTimeout(() => {
          if (playerWeapon === w && playerCanAct && !gameOver) {
            playerAttack();
          }
        }, 100);
      });
    });

    // Initialize
    setupCharacterColors();
    setHealthBar(playerHealthBar, 100);
    setHealthBar(enemyHealthBar, 100);
    updateButtonStates();
    setMessage('Choose your weapon and attack!');
  </script>
</body>
</html>
